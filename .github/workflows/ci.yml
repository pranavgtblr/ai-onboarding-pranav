name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.10

      - name: Run CI on all project phases
        run: |
          set -e
          # Find all directories containing pyproject.toml
          PROJECT_DIRS=$(find . -name "pyproject.toml" -not -path "*/.*" -exec dirname {} \;)
          
          for dir in $PROJECT_DIRS; do
            echo "=================================================="
            echo "Running CI in $dir"
            echo "=================================================="
            (
              cd "$dir"
              echo "==> Syncing dependencies..."
              uv sync
              
              echo "==> Running Ruff linter..."
              uv run ruff check .
              
              echo "==> Running Ruff format check..."
              uv run ruff format --check .
              
              echo "==> Running Pyright type check..."
              uv run pyright
              
              echo "==> Running Pytest..."
              uv run pytest
            )
          done
