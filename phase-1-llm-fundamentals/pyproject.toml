[project]
name = "phase-1-llm-fundamentals"
version = "0.1.0"
description = "Phase 1: LLM Fundamentals - Tokenization, Cost Analysis, and Sampling Parameters"
readme = "README.md"
authors = [
    { name = "Pranav G", email = "pranav.g@toobler.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.5",
    "tiktoken>=0.7.0",
]

[project.scripts]
tokenize-demo = "phase_1_llm_fundamentals.tokenizer_demo:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
