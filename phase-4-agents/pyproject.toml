[project]
name = "phase-4-agents"
version = "0.1.0"
description = "Phase 4: Autonomous AI Agents with LangChain and LangGraph"
readme = "README.md"
authors = [
    { name = "Pranav G", email = "pranav.g@toobler.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=1.6.2",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langgraph-checkpoint-redis>=0.5.2",
    "psycopg>=3.3.5",
    "psycopg-binary>=3.3.5",
    "psycopg-pool>=3.3.1",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    "redis>=8.1.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
tool-agent = "phase_4_agents.agent_cli:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
