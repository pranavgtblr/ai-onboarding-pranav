[project]
name = "phase-6-capstone"
version = "0.1.0"
description = "Phase 6 Capstone: PG Recommends - Stateful AI Film Curator Platform"
readme = "README.md"
authors = [
    { name = "Pranav G", email = "pranav.g@toobler.com" }
]
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "phase-3-rag",
    "phase-4-agents",
    "phase-5-production",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "rank-bm25>=0.2.2",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
pg-recommends = "phase_6_capstone.server:run_server"
pg-sync = "phase_6_capstone.ingestion:sync_cli"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
phase-3-rag = { path = "../phase-3-rag", editable = true }
phase-4-agents = { path = "../phase-4-agents", editable = true }
phase-5-production = { path = "../phase-5-production", editable = true }

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "strict"
